{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
      <a href="{{ url_for('shops_list') }}" class="btn btn-sm btn-outline-secondary me-3 border-subtle">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h2 class="h3 fw-bold mb-0 text-white">Add New Shop</h2>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <form method="POST">
          <h5 class="mb-3 text-white border-bottom pb-2">Shop Details</h5>
          <div class="mb-4">
            <label for="name" class="form-label text-muted small fw-bold">Shop Name</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-store fa-fw text-muted"></i></span>
              <input type="text" class="form-control" id="name" name="name" required placeholder="Enter shop name...">
            </div>
          </div>
          
          <div class="mb-4">
            <label for="phone_number" class="form-label text-muted small fw-bold">Shop Phone Number</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-phone fa-fw text-muted"></i></span>
              <input type="text" class="form-control" id="phone_number" name="phone_number" placeholder="Optional phone number...">
            </div>
          </div>
          
          <h5 class="mb-3 text-white border-bottom pb-2 mt-4">Local Admin Details</h5>
          <div class="mb-3">
            <label for="admin_username" class="form-label text-muted small fw-bold">Admin Username</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-user fa-fw text-muted"></i></span>
              <input type="text" class="form-control" id="admin_username" name="admin_username" required placeholder="admin_shop1">
            </div>
          </div>

          <div class="mb-4">
            <label for="admin_password" class="form-label text-muted small fw-bold">Admin Password</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-lock fa-fw text-muted"></i></span>
              <input type="password" class="form-control" id="admin_password" name="admin_password" required placeholder="••••••••">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <a href="{{ url_for('shops_list') }}" class="btn btn-light px-4">Cancel</a>
            <button type="submit" class="btn btn-danger px-4 shadow-sm">
              <i class="fa-solid fa-save me-1"></i> Create Shop
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
