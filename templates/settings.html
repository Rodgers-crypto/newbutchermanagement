{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="d-flex align-items-center mb-4 pb-2 border-bottom">
      <h2 class="h3 fw-bold mb-0 text-white"><i class="fa-solid fa-gear text-danger me-2"></i> Shop Settings</h2>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <form method="POST">
          <div class="mb-4">
            <label for="name" class="form-label text-muted small fw-bold">Shop Name</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-store fa-fw text-muted"></i></span>
              <input type="text" class="form-control" id="name" name="name" value="{{ shop_name }}" required placeholder="Enter shop name...">
            </div>
            <div class="form-text text-muted">This name will appear on the system interface and receipts.</div>
          </div>

          <div class="mb-4">
            <label for="phone_number" class="form-label text-muted small fw-bold">Shop Phone Number</label>
            <div class="input-group">
              <span class="input-group-text bg-surface-hover border-subtle"><i class="fa-solid fa-phone fa-fw text-muted"></i></span>
              <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ shop_phone }}" placeholder="Optional shop phone number...">
            </div>
            <div class="form-text text-muted">This number will appear on receipts and reports.</div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-danger px-4 shadow-sm">
              <i class="fa-solid fa-save me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
